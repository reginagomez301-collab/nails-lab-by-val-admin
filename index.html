
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NAILS LAB BY VAL | Administración</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f8f2ee;
      color: #684e4c;
      font-family: Georgia, serif;
    }

    .panel {
      width: 100%;
      max-width: 390px;
      padding: 42px 25px;
      text-align: center;
      background: #fffdfb;
      border: 1px solid #eadbd5;
      border-radius: 24px;
      box-shadow: 0 12px 35px #684e4c12;
    }

    .flower {
      font-size: 36px;
      color: #b8848c;
    }

    .brand {
      margin-top: 20px;
      font-size: 12px;
      letter-spacing: 3px;
    }

    h1 {
      margin: 20px 0 10px;
      font-size: 28px;
      font-weight: normal;
    }

    p {
      font-family: Arial, sans-serif;
      font-size: 14px;
      line-height: 1.8;
      color: #907774;
    }

    .status {
      margin-top: 28px;
      padding: 15px;
      background: #f8f2ee;
      border-radius: 12px;
      font-family: Arial, sans-serif;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main class="panel">
    <div class="flower">♡</div>
    <div class="brand">NAILS LAB BY VAL</div>
    <h1>Hola, Val ♡</h1>
    <p>
      Bienvenida a tu espacio de administración.
      Aquí podrás consultar, confirmar y rechazar
      las solicitudes de tus clientas.
    </p>
    <div class="status">
      Estamos preparando tu acceso privado ♡
    </div>
  </main>
</body>
</html>
