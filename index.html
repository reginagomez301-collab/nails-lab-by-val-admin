
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NAILS LAB BY VAL | Administración</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f8f2ee;
      color: #684e4c;
      font-family: Georgia, serif;
    }

    .panel {
      width: 100%;
      max-width: 390px;
      padding: 42px 25px;
      text-align: center;
      background: #fffdfb;
      border: 1px solid #eadbd5;
      border-radius: 24px;
      box-shadow: 0 12px 35px #684e4c12;
    }

    .flower {
      font-size: 36px;
      color: #b8848c;
    }

    .brand {
      margin-top: 20px;
      font-size: 12px;
      letter-spacing: 3px;
    }

    h1 {
      margin: 20px 0 10px;
      font-size: 28px;
      font-weight: normal;
    }

    p {
      font-family: Arial, sans-serif;
      font-size: 14px;
      line-height: 1.8;
      color: #907774;
    }

    .status {
      margin-top: 28px;
      padding: 15px;
      background: #f8f2ee;
      border-radius: 12px;
      font-family: Arial, sans-serif;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main class="panel">
    <div class="flower">♡</div>
    <div class="brand">NAILS LAB BY VAL</div>
    <h1>Hola, Val ♡</h1>
    <p>
      Bienvenida a tu espacio de administración.
      Aquí podrás consultar, confirmar y rechazar
      las solicitudes de tus clientas.
    </p>
    <div id="recuperar-contrasena" style="display:none; margin-top:24px;">
  <h2 style="font-size:21px; font-weight:normal;">
    Crea tu contraseña ♡
  </h2>

  <input
    id="nueva-contrasena"
    type="password"
    placeholder="Nueva contraseña"
    autocomplete="new-password"
    minlength="8"
    style="width:100%; padding:14px; margin:12px 0;
           border:1px solid #eadbd5; border-radius:10px;"
  >

  <button
    id="guardar-contrasena"
    type="button"
    style="width:100%; padding:14px; background:#b8848c;
           color:white; border:0; border-radius:10px;"
  >
    Guardar contraseña
  </button>

  <p id="mensaje-contrasena" role="status"></p>
</div>
    <div class="status">
      Estamos preparando tu acceso privado ♡
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const supabaseClient = window.supabase.createClient(
    "https://skahboxofhstnynqdfak.supabase.co",
    "sb_publishable_8spsZ0KF2rTbVUOb6MOtMg__wPQwRYN"
  );
  const formulario = document.getElementById("recuperar-contrasena");
const boton = document.getElementById("guardar-contrasena");
const mensaje = document.getElementById("mensaje-contrasena");

let recuperacionAutorizada = false;

supabaseClient.auth.onAuthStateChange((evento) => {
  if (evento === "PASSWORD_RECOVERY") {
    recuperacionAutorizada = true;
    formulario.style.display = "block";
  }
});

boton.addEventListener("click", async () => {
  if (!recuperacionAutorizada) {
    mensaje.textContent = "Abre el enlace de recuperación de tu correo.";
    return;
  }

  const nuevaContrasena = document.getElementById("nueva-contrasena").value;

  if (nuevaContrasena.length < 8) {
    mensaje.textContent = "La contraseña debe tener al menos 8 caracteres.";
    return;
  }

  boton.disabled = true;
  mensaje.textContent = "Guardando contraseña...";

  const { error } = await supabaseClient.auth.updateUser({
    password: nuevaContrasena
  });

  boton.disabled = false;

  if (error) {
    mensaje.textContent = "No se pudo guardar: " + error.message;
  } else {
    mensaje.textContent = "¡Contraseña creada correctamente! ♡";
    document.getElementById("nueva-contrasena").value = "";
    recuperacionAutorizada = false;
    await supabaseClient.auth.signOut();
  }
});
</script>
</body>
</html>
